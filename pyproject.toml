# The only Python left is the four scripts under tools/. This keeps them
# formatted and linted the same way they always were.

[tool.ruff]
line-length = 88
extend-exclude = ["dist", "build"]
target-version = "py310"

[tool.ruff.format]
# Prefer single quotes over double quotes
quote-style = "single"

[tool.ruff.lint]
ignore = [
    "N818", # error-suffix-on-exception-name
    "E501", # Line-too-long, let formatter resolve it

]
select = [
    "A", # flake8-builtins
    "E", # pycodestyle
    "F", # Pyflakes
    "N", # pep8-naming
    "W", # pycodestyle
    "I", # isort

]

[tool.pyright]
reportMissingImports = "information"
reportMissingModuleSource = "information"
