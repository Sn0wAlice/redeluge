[package]
name = "redeluge-web"
description = "The redeluge Web UI server: the JSON-RPC endpoint and its assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "redeluge-web"
path = "src/main.rs"

[dependencies]
redeluge-rencode = { path = "../redeluge-rencode" }
redeluge-rpc = { path = "../redeluge-rpc" }
actix-web = { version = "4", default-features = false, features = ["macros", "compress-gzip", "cookies"] }
actix-files = "0.6"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ring.workspace = true
hex = "0.4"
# scrypt is not in ring; this is the RustCrypto implementation, used so the
# cost function is not hand-written.
scrypt = { version = "0.11", default-features = false }
httpdate = "1"
# The add dialog posts a multipart form, and one call fetches a torrent by URL
# on the server's behalf. rustls rather than OpenSSL, as everywhere else.
actix-multipart = { version = "0.7", default-features = false, features = ["tempfile"] }
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2"] }

[dev-dependencies]
actix-rt = "2"
# The integration test boots the application and drives it over HTTP, which
# needs actix's own test harness and its request type.
actix-http = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"
ring.workspace = true
hex = "0.4"
