services:
  redeluge:
    build:
      context: .
    # A fixed tag, because a locally built image has no version to carry. The
    # one number that means anything is in Cargo.toml: the binaries report it
    # and the publish workflow reads it from there. A copy here was only ever a
    # way for the tag to disagree with what was inside it, which it did.
    image: redeluge:local
    container_name: redeluge
    restart: unless-stopped

    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: "022"
      # Either of these sets the log level. RUST_LOG is the one the binaries
      # read and the only one that can name a module; DELUGE_LOGLEVEL is what
      # the Deluge images use and is translated for you.
      RUST_LOG: ${RUST_LOG:-}
      DELUGE_LOGLEVEL: ${DELUGE_LOGLEVEL:-info}
      # Applied on first boot only, unless DELUGE_WEB_PASSWORD_RESET=1.
      DELUGE_WEB_PASSWORD: ${DELUGE_WEB_PASSWORD:?copy .env.example to .env and set a web password}
      DELUGE_WEB_PASSWORD_RESET: ${DELUGE_WEB_PASSWORD_RESET:-0}

    volumes:
      - ./data/config:/config
      - ./data/downloads:/downloads

    ports:
      # The Web UI authenticates with a single password, so it stays on
      # loopback. Guesses are rate limited and the password is scrypt, but
      # neither is a reason to expose it: put a reverse proxy with TLS in front
      # of it before it reaches a network.
      - "127.0.0.1:8112:8112"
      # BitTorrent peer traffic, which does need to be reachable.
      - "58946:58946/tcp"
      - "58946:58946/udp"
      # Daemon RPC, for a thin client. allow_remote must be turned on in
      # core.conf first, and the port is deliberately left closed by default.
      #- "127.0.0.1:58846:58846"

    healthcheck:
      test: ["CMD", "redeluge-web", "--health-check"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    security_opt:
      - no-new-privileges:true
