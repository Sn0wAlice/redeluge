name: Gate

# The gate on every push and every pull request, on both architectures.
#
# It was run by hand until now, which meant it was run when somebody
# remembered. The two architectures are not belt and braces: a test has failed
# on one and passed on the other before, which is the whole reason the image is
# built for both.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first one's answer worthless, so
# it is cancelled rather than left to finish. Not for main: what landed there
# is worth knowing about even if something else lands a minute later.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      # One architecture failing is a reason to see what the other one did, not
      # a reason to stop it.
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-latest
          # Free for public repositories. On a private one this runner is
          # billed, and the honest alternatives are dropping this line or
          # building it under QEMU, which is slow enough to hurt.
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # `docker/rust.sh` builds into `target-docker`, which is ignored by git
      # and therefore safe to carry between runs. Keyed on the lockfile: a
      # dependency change is the thing that makes the old artefacts useless.
      - name: Reuse the last build
        uses: actions/cache@v4
        with:
          path: target-docker
          key: gate-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'docker/Dockerfile.rust') }}
          restore-keys: |
            gate-${{ matrix.arch }}-

      - name: Run the gate
        run: ./docker/rust.sh

  front-end:
    name: front end
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The interface is twenty thousand lines of ExtJS that wants a document,
      # a layout and a browser's idea of what is visible, so the checks run in
      # the browser the runner already has. Every one of them is there because
      # the thing it checks broke once.
      - name: Run the front-end checks
        run: python3 tools/ui_harness.py

  vulnerabilities:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Anonymous, which is rate limited to a handful of scans an hour across
      # every project sharing a runner's address. So the scan itself is never
      # allowed to fail the build — a rate limit is not a vulnerability — and
      # the step below fails it on what was actually found. An API token in
      # `VULN_MLAB_TOKEN` would make the scan itself reliable; without one this
      # is a report that sometimes does not arrive.
      - name: Scan Cargo.lock
        id: scan
        continue-on-error: true
        # The exact tag the action publishes. Its README's example says `@v1`,
        # and there is no such tag — a floating major would resolve to whatever
        # is on it anyway, which is not what a build worth reproducing runs.
        uses: mlab-sh/vuln-scan-action@v1.0.0
        with:
          path: Cargo.lock
          fail-on: high
          soft-fail: "true"

      # Through the environment rather than into the script: these are a
      # third-party action's outputs, read out of a lockfile a pull request
      # can write, and a value interpolated into a `run:` is the shell's to
      # parse, not a string.
      - name: Fail on what it found
        if: steps.scan.outputs.failed == 'true'
        env:
          TOTAL: ${{ steps.scan.outputs.total }}
          PACKAGES: ${{ steps.scan.outputs.vulnerable-packages }}
        run: |
          echo "::error::${TOTAL} known vulnerabilities in ${PACKAGES} packages, at or above the threshold"
          exit 1

      - name: Say what it found
        if: steps.scan.outputs.failed != 'true'
        env:
          TOTAL: ${{ steps.scan.outputs.total }}
        run: |
          total="$TOTAL"
          if [ -z "$total" ]; then
            echo "The scan did not answer — anonymous scans are rate limited."
          else
            echo "$total known vulnerabilities, none at or above the threshold."
          fi
